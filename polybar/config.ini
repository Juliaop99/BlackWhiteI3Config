[colors]
background = #00000000
background-alt = #373B41
foreground = #C5C8C6
primary = #F0C674
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/example]
width = 100%
height = 24pt
radius = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0pt
border-color = #00000000

padding-left = 0
padding-right = 1

module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

# Fuente para texto
font-0 = "JetBrainsMono Nerd Font:style=Medium:size=10;2"
# Fuente específica para que los iconos se vean un poco más grandes
font-1 = "JetBrainsMono Nerd Font:style=Medium:size=13;3"

modules-left = i3
modules-center = date
modules-right = audio battery time

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

override-redirect = false

;==========================================================
;			Modules
;==========================================================
[module/battery]
type = internal/battery
full-at = 99

# Formato cuando está CARGANDO
format-charging = <label-charging>
format-charging-prefix = "󱐋 "
format-charging-prefix-foreground = #f1fa8c
label-charging = %percentage%%

# Formato cuando está DESCARGANDO (Aquí es donde cambian los iconos)
format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%

# Formato cuando está LLENA
format-full-prefix = "  "
format-full-prefix-foreground = #50fa7b
label-full = %percentage%%

# Iconos que cambian según el nivel (Rampa de capacidad)
# Se ajustan automáticamente: 0-20%, 21-40%, etc.
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 

# Opcional: Color rojo para cuando queda poca batería
ramp-capacity-0-foreground = #ff5555

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT0
adapter = ADP1
poll-interval = 5


[module/powermenu]
type = custom/text
content = ⏻
click-left = ~/.config/polybar/scripts/powermenu.sh


[module/i3]
type = internal/i3

pin-workspaces = true
show-urgent = false
strip-wsnumbers = false
index-sort = true

enable-click = true
enable-scroll = false
wrapping-scroll = false
reverse-scroll = false

; Available tags:
;   <label-state> (default) - gets replaced with <label-(focused|unfocused|visible|urgent)>
;   <label-mode> (default)
format = <label-state> <label-mode>

; Label backgrond
label-mode = %mode%
label-mode-padding = 1
label-mode-background = #e60053

; Focused workspace
label-focused = %index%
label-focused-foreground = #ffffff
label-focused-background = #3f3f3f
label-focused-underline = #ffffff
label-focused-padding = 1

; Unfocused workspace
label-unfocused = %index%
label-unfocused-padding = 1

; Workspace underline
label-visible = %index%
label-visible-underline = #ffffff
label-visible-padding = 1

; Urgent workspace
label-urgent = %index%
label-urgent-foreground = #000000
label-urgent-background = #bd2c40
label-urgent-padding = 1


[module/date]
type = internal/date
interval = 60.0

date = %A, %d %B %Y
date-alt = %d-%m-%Y%


[module/time]
type = internal/date
interval = 1.0

date = %H:%M

[module/audio]
type = internal/pulseaudio

; Use PA_VOLUME_UI_MAX (~153%) if true, or PA_VOLUME_NORM (100%) if false
use-ui-max = false

; Interval for volume increase/decrease (in percent points)
interval = 5

label-volume = %percentage%%
format-muted = <label-muted>
label-muted = 󰖁 %percentage%%

format-volume = <ramp-volume> <label-volume>
ramp-volume-0 = 󰕿 
ramp-volume-1 = 󰖀
ramp-volume-2 = 󰕾

